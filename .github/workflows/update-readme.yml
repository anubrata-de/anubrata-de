# Rebuilds the projects and tech stack sections of the profile README from the
# portfolio's project data, which is synced from GitHub every morning.
name: Update profile README

on:
  schedule:
    - cron: "47 1 * * *" # every day, 07:17 in India, half an hour after the portfolio sync
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    paths:
      - scripts/build-readme.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the projects and tech stack sections
        run: node scripts/build-readme.mjs
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
      - name: Commit if anything changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update projects from GitHub"
          git push
